plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id("pl.allegro.tech.build.axion-release") version "1.21.3"
}

repositories {
    mavenCentral()
}

group = 'ru.rozhi'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

scmVersion {
    repository {
        directory.set(project.rootDir.parentFile.absolutePath)
    }

    tag {
        prefix.set(project.name)
        versionSeparator.set("-")
    }

    versionCreator('simple')

    branchVersionIncrementer.putAll(
            'feature/.*'   : 'incrementMinor',
            'feat/.*'      : 'incrementMinor',
            'fix/.*'       : 'incrementPatch',
            'bugfix/.*'    : 'incrementPatch',
            'patch/.*'     : 'incrementPatch',
            'breaking/.*'  : 'incrementMajor',
            'break/.*'     : 'incrementMajor'
    )
}

version = scmVersion.version