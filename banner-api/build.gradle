buildscript {
    ext {
        springBootVersion = '4.1.1'
        javaVersion = 25
    }
}

plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version '1.1.7'
    id 'pl.allegro.tech.build.axion-release' version '1.21.3'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
    }
}

group = 'ru.rozhi'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

dependencies {
    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:${springBootVersion}")

    // spring
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

    // test
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'com.adobe.testing:s3mock-testcontainers:5.2.2'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'com.github.nastarozina:error-handling-starter:1.0.3'
}

tasks.named('test') {
	useJUnitPlatform()
}

scmVersion {
    repository {
        directory.set(project.rootDir.parentFile.absolutePath)
    }

    tag {
        prefix.set(project.name)
        versionSeparator.set("-")
    }

    versionCreator('simple')
}

version = scmVersion.version