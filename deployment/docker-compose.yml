services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:17
    container_name: keycloak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - keycloak-network


  # ============================================================
  # Keycloak
  # ============================================================

  keycloak:
    image: keycloak/keycloak:26.7
    container_name: keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --import-realm

    environment:
      # Initial Keycloak admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # HTTP
      KC_HTTP_PORT: 80

      # Local development
      KC_HOSTNAME: http://localhost:8080/api/auth
      KC_HOSTNAME_STRICT: false

      # Health / metrics
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

    ports:
      - "9002:9000"

    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    networks:
      - keycloak-network
      - gateway-keycloak

# ============================================================ 
# INBOUND GATEWAY 
# ============================================================ 
    
  inbound-gateway:
      image: inbound-gateway:0.1.0-SNAPSHOT
      container_name: inbound-gateway
      restart: unless-stopped
      ports:
          - "8080:8080"

      environment:
          KEYCLOAK_REALM: test
          ISSUER_URI: http://localhost:8080/api/auth/realms/test
          JWK_SET_URI: http://keycloak/realms/test/protocol/openid-connect/certs
          SERVER_PORT: 8080

      depends_on:
          keycloak:
              condition: service_started

      networks:
          - gateway-keycloak
          - gateway-network
          - minio-network

  # ============================================================
  # MinIO
  # ============================================================

  minio:
    image: webhippie/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: password

    volumes:
      - minio_data:/data

    networks:
      - gateway-network
      - minio-network


  # ============================================================
  # MongoDB
  # ============================================================

  mongo:
    image: mongo:8.3.11
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: neAvito
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - infra-network


  # ============================================================
  # Banner API
  # ============================================================

  banner-api:
    image: banner-api:0.1.1-SNAPSHOT
    container_name: banner-api
    restart: unless-stopped

    environment:
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017/neAvito

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: password
      S3_BUCKET: banner
      CATEGORY_API_URL: http://category-api
      SERVER_PORT: 80

    depends_on:
      mongo:
        condition: service_started
      minio:
        condition: service_started

    networks:
      - infra-network
      - gateway-network
      - minio-network


  # ============================================================
  # Category API
  # ============================================================

  category-api:
    image: category-api:0.1.0-SNAPSHOT
    container_name: category-api
    restart: unless-stopped

    environment:
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017/neAvito
      SERVER_PORT: 80

    depends_on:
      mongo:
        condition: service_started

    networks:
      - infra-network
      - gateway-network


  # ============================================================
  # User API
  # ============================================================

#  user-api:
#    image: user-api:latest
#    container_name: user-api
#    restart: unless-stopped
#
#    environment:
#      # MongoDB
#      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/neAvito
#
#    depends_on:
#      mongo:
#        condition: service_started
#
