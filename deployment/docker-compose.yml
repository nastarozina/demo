#      - infra-network
#      - gateway-network


# ==============================================================
# Volumes
# ==============================================================

volumes:
  keycloak-postgres-data:
  minio_data:
  mongo_data:


# ==============================================================
# Network
# ==============================================================

networks:
    keycloak-network: 
        name: keycloak-network 
        driver: bridge
    gateway-keycloak: 
        name: gateway-keycloak 
        driver: bridge 
    gateway-network: 
        name: gateway-network 
        driver: bridge
    infra-network:
        name: infra-network 
        driver: bridge
    minio-network:
        name: minio-network 
        driver: bridge
